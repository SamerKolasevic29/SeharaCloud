services:
  seharacloud-db:
    image: postgres:16-alpine
    container_name: seharacloud-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - /data/seharacloud/db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouduser -d seharacloud-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  seharacloud-api:
    build:
      context: /data/configs/seharacloud/api/
      dockerfile: server/api/SeharaCloud.api/Dockerfile
    container_name: seharacloud-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=seharacloud-db;Port=5432;Database=seharacloud-db;Username=clouduser;Password=vuduuser
    volumes:
      - /data/seharacloud/media:/mnt/cloud
      - ./appsettings.Production.json:/app/appsettings.Production.json:ro
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      seharacloud-db:
        condition: service_healthy
    networks:
      - internal

  seharacloud-indexer:
    build:
      context: /data/configs/seharacloud/api/server/indexer
      dockerfile: Dockerfile
    container_name: seharacloud-indexer
    restart: unless-stopped
    environment:
      - DB_CONNECTION_STRING=postgresql://clouduser:vuduuser@seharacloud-db:5432/seharacloud-db
      - PHYSICAL_BASE_PATH=/data/seharacloud/media
      - LOGICAL_BASE_PATH=/mnt/cloud
    volumes:
      - /data/seharacloud/media:/data/seharacloud/media
    depends_on:
      seharacloud-db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
